# 校准 v4ri（LY 2026-11-07 15:15 选 B）：v4r（先看完自己的文件 + 代入身份）+ 把内部上报（Channel I）写成 F 类问题的正式途径之一，
# 外部举报（Channel E）不再像是规定。只测 $300 奖金，8 局。规则见 docs/设计.md §8。
run_id: calib_v4ri
out_dir: runs
backend:
  type: vllm
  model: Qwen/Qwen3.5-9B
  dtype: bfloat16
  enable_thinking: true      # LY：v4 开思考
  max_new_tokens: 4096
  temperature: 0.6
  top_p: 0.95
  enforce_eager: true
  gpu_memory_utilization: 0.55   # 和 ToM 流程共用显卡
  max_prompt_tokens: 98304
lesions_config: configs/lesions.yaml
world: {n_agents: 5, threshold: 3, monthly_pay_usd: 6000}   # LY：月薪 $6,000
design:
  seeds: [101, 102]
  k_evidence: [5]
  harm: [low, high]
  communication: [isolated, discuss]
  lesion_conditions: [none]
  briefs: [v4ri]               # LY 11-07 选 B：v4r + Channel I 也是 F 类问题的正式上报途径
  awards: [300]               # LY 11-07：只测有 $300 一次性奖金的版本（立案成功时每个举报者）
protocol:
  analysis_max_steps: 40
  discussion_minutes: 10
  minutes_per_round: 2
