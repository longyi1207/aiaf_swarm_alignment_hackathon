# Steering dose check (2026-11-08, docs/设计.md §8): tom up/down along tau2, empathy up, matched random; thinking on, budget 4096.
# Prefix cache is keyed by condition (cache_salt). Clean ToM items (tom2clean: 144 items without the conflicting-cue wording).
run_id: dose_check_steer
out_dir: runs
backend:
  type: vllm
  model: Qwen/Qwen3.5-9B
  dtype: bfloat16
  device: auto
  temperature: 0.0
  enforce_eager: true
  gpu_memory_utilization: 0.90
lesions_config: configs/lesions_steer.yaml
conditions: [none, tom_up_c4, tom_up_c8, tom_up_c16, tom_dn_c4, tom_dn_c8, tom_dn_c16, emp_up_c4, emp_up_c8, emp_up_c16, rand_tom_c8, rand_emp_c8]
thinking: [true]
max_tokens_thinking: {tom2clean: 4096, tom2ctl: 4096, empathy: 4096, capability: 4096}
tasks: [tom2clean, tom2ctl, empathy, capability]
limit: {tom2ctl: 72}
chunk: 4096
judge:
  type: hf_self
