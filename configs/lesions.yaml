  rand2_early:
    edits: [{file: rand_dirs, axes: [rand_dir], layers: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
  rand2_mid:
    edits: [{file: rand_dirs, axes: [rand_dir], layers: [12, 13, 14, 15, 16, 17, 18, 19, 20]}]
  rand2_late:
