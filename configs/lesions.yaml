# 损伤条件（推理时从残差流里投影掉方向；不改权重）。
# 向量来自 LY 的 tom-empathy-dissociation（Qwen/Qwen3.5-9B），见 assets/vectors/README.md。
# 每个 axis 默认用 payload metadata 里的 best_layer（τ=8, ε=17），和 8 月的实验一致。

vector_files:
  coarse:
    path: assets/vectors/axes_vectors.pt
    sha256: ce239044e347834996ba890741e43865fff33d1b87e751bdd378b3623d4c6ece
  sae:
    path: assets/vectors/axes_vectors_sae.pt
    sha256: bc27ce6ee27a2c6731cac6a4e55cdb24b63b225d55701396d6b66c81a7e9a13b
  random:
    path: assets/vectors/axes_vectors_random.pt
    sha256: a6d476744b97cbfdd1acf1cadc6b8708000bcb1098638693ad277faf0989eaa5
  # 2026-11-03：共情 top-10（L17）+ L17 随机对照，由 scripts/build_sae_axes.py 生成（见 assets/vectors/README.md）
  sae_v2:
    path: assets/vectors/axes_vectors_sae_v2.pt
    sha256: e4123b513dc3171decced3b45c0309ff74d32ba0ead47a0da8958e97216863e8
  # 2026-11-06：全层消融的随机方向对照（每层一个固定种子的高斯单位向量），scripts/build_random_dirs.py 生成
  rand_dirs:
    path: assets/vectors/axes_random_dirs.pt
    sha256: 689da9bee449b7bf20bb1caf26a7af1d132e3485dd7fa33176be648f918e916f

  # 2026-11-07：ToM v2（错误信念 vs 正确信念的最小对，去掉旁观者对照方向），scripts/extract_tom_v2.py
  tom_v2:
    path: assets/vectors/axes_tom_v2.pt
    sha256: 8e5846282d0d050e7e65348afc9f18da158ae0784b8e919b9fd6b743af950a2a

conditions:
  none:
    edits: []

  # --- 主设计 2×2：由 scripts/select_tom2.py 写入（runs/dose_check_tom2_confirm + runs/probe_tom2 + runs/dose_check_v4b）---
  # 没找到合格的 ToM v2 损伤，只用共情 = emp_coarse_all_a70
  # 方案 B（LY 2026-11-07）：探索性 ToM 组 = tom2_L6（没通过预设的截断标准）
  tom:
    edits:
      - file: tom_v2
        axes: [tau2]
        layer: 6
  emp:
    edits:
      - file: coarse
        axes: [epsilon]
        layers: all
        alpha: 0.7
  tom_emp:
    edits:
      - file: tom_v2
        axes: [tau2]
        layer: 6
      - file: coarse
        axes: [epsilon]
        layers: all
        alpha: 0.7
  # 对照：按所选损伤逐项配同层、同数量、同强度的随机扰动
  random:
    edits:
      - file: rand_dirs
        axes: [rand_dir]
        layers: all
        alpha: 0.7

  # 方案 B：ToM 组的随机对照（同层同强度）
  random_tom:
    edits:
      - file: rand_dirs
        axes: [rand_dir]
        layer: 6
  # Matched control for the combined intervention (not part of the seven-arm pilot).
  random_joint:
    edits:
      - file: rand_dirs
        axes: [rand_dir]
        layer: 6
      - file: rand_dirs
        axes: [rand_dir]
        layers: all
        alpha: 0.7
  # 方案 C（LY 2026-11-07）：跨层 ToM 组 = tom2_all_a30（每层去掉 30%），及其随机对照
  tom_all30:
    edits:
      - file: tom_v2
        axes: [tau2]
        layers: all
        alpha: 0.3
  random_all30:
    edits:
      - file: rand_dirs
        axes: [rand_dir]
        layers: all
        alpha: 0.3

  # --- Phase 0b 剂量阶梯（configs/dose_check.yaml）。配平后把上面的 tom / emp 指向选定的强度 ---
  tom_sae1:
    edits: [{file: sae, axes: [sae_tau_top10_f0]}]
  tom_sae3:
    edits: [{file: sae, axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2]}]
  tom_sae5:
    edits: [{file: sae, axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2, sae_tau_top10_f3, sae_tau_top10_f4]}]
  tom_sae10:
    edits:
      - file: sae
        axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2, sae_tau_top10_f3, sae_tau_top10_f4,
               sae_tau_top10_f5, sae_tau_top10_f6, sae_tau_top10_f7, sae_tau_top10_f8, sae_tau_top10_f9]
  emp_sae1:
    edits: [{file: sae_v2, axes: [sae_epsilon_top10_f0]}]
  emp_sae3:
    edits: [{file: sae_v2, axes: [sae_epsilon_top10_f0, sae_epsilon_top10_f1, sae_epsilon_top10_f2]}]
  emp_sae5:
    edits: [{file: sae_v2, axes: [sae_epsilon_top10_f0, sae_epsilon_top10_f1, sae_epsilon_top10_f2, sae_epsilon_top10_f3,
                                   sae_epsilon_top10_f4]}]
  emp_sae10:
    edits:
      - file: sae_v2
        axes: [sae_epsilon_top10_f0, sae_epsilon_top10_f1, sae_epsilon_top10_f2, sae_epsilon_top10_f3, sae_epsilon_top10_f4,
               sae_epsilon_top10_f5, sae_epsilon_top10_f6, sae_epsilon_top10_f7, sae_epsilon_top10_f8, sae_epsilon_top10_f9]
  random_L17:
    edits:
      - file: sae_v2
        axes: [sae_random_L17_f0, sae_random_L17_f1, sae_random_L17_f2, sae_random_L17_f3, sae_random_L17_f4,
               sae_random_L17_f5, sae_random_L17_f6, sae_random_L17_f7, sae_random_L17_f8, sae_random_L17_f9]

  # --- 粗方向（diff-of-means，8 月 abl_tau / abl_epsilon），也是剂量阶梯的一档 ---
  tom_coarse:
    edits:
      - file: coarse
        axes: [tau]
  emp_coarse:
    edits:
      - file: coarse
        axes: [epsilon]

  # --- 2026-11-06 剂量阶梯扩展（偏离预注册，见 runs/timeline.md 和 docs/设计.md §6 补记）---
  # 原阶梯在关思考时 ToM 没有一档"有效"（95% CI 都含 0）；开思考时 tom_sae3/5/10 让推理陷入重复循环（截断 52–64%）。
  # 按规则"重新考虑强度"，补上文献里的标准做法：在所有 32 层各自投影掉该层的粗方向（Arditi et al. 2024, arXiv 2406.11717）。
  # 单层消融容易被后面的层补偿（8 月 RQ2 的粗方向单层消融就是 null）。配平规则不变。
  tom_coarse_all:
    edits: [{file: coarse, axes: [tau], layers: all}]
  emp_coarse_all:
    edits: [{file: coarse, axes: [epsilon], layers: all}]
  random_dir_all:
    edits: [{file: rand_dirs, axes: [rand_dir], layers: all}]

  # --- 2026-11-06 夜：v4 的 ToM 修复候选（部分削弱：只去掉方向分量的 alpha 比例）---
  # v3 主实验里 tom_sae3（完全去掉）让 agent 的工具使用和角色扮演崩溃；开思考时还会让推理陷入循环。
  tom_sae3_a30:
    edits: [{file: sae, axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2], alpha: 0.3}]
  tom_sae3_a50:
    edits: [{file: sae, axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2], alpha: 0.5}]
  tom_sae3_a70:
    edits: [{file: sae, axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2], alpha: 0.7}]
  tom_sae10_a30:
    edits:
      - file: sae
        axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2, sae_tau_top10_f3, sae_tau_top10_f4,
               sae_tau_top10_f5, sae_tau_top10_f6, sae_tau_top10_f7, sae_tau_top10_f8, sae_tau_top10_f9]
        alpha: 0.3
  tom_sae10_a50:
    edits:
      - file: sae
        axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2, sae_tau_top10_f3, sae_tau_top10_f4,
               sae_tau_top10_f5, sae_tau_top10_f6, sae_tau_top10_f7, sae_tau_top10_f8, sae_tau_top10_f9]
        alpha: 0.5

  # --- 2026-11-07 凌晨：v4 损伤搜索（LY：找到只影响目标能力、不影响能力/工具使用的 ToM 和共情损伤）---
  tom_sae10_a70:
    edits:
      - file: sae
        axes: [sae_tau_top10_f0, sae_tau_top10_f1, sae_tau_top10_f2, sae_tau_top10_f3, sae_tau_top10_f4,
               sae_tau_top10_f5, sae_tau_top10_f6, sae_tau_top10_f7, sae_tau_top10_f8, sae_tau_top10_f9]
        alpha: 0.7
  emp_coarse_all_a30:
    edits: [{file: coarse, axes: [epsilon], layers: all, alpha: 0.3}]
  emp_coarse_all_a50:
    edits: [{file: coarse, axes: [epsilon], layers: all, alpha: 0.5}]
  emp_coarse_all_a70:
    edits: [{file: coarse, axes: [epsilon], layers: all, alpha: 0.7}]
  # 共情粗方向只在中间层（13–21，围绕 best_layer 17）
  emp_coarse_mid:
    edits: [{file: coarse, axes: [epsilon], layers: [13, 14, 15, 16, 17, 18, 19, 20, 21]}]
  random_dir_all_a50:
    edits: [{file: rand_dirs, axes: [rand_dir], layers: all, alpha: 0.5}]
  random_dir_mid:
    edits: [{file: rand_dirs, axes: [rand_dir], layers: [13, 14, 15, 16, 17, 18, 19, 20, 21]}]

  # --- ToM v2 筛选（2026-11-07，scripts/register_tom_v2.py）---
  tom2_L4:
    edits: [{file: tom_v2, axes: [tau2], layer: 4}]
  tom2_L6:
    edits: [{file: tom_v2, axes: [tau2], layer: 6}]
  tom2_L8:
    edits: [{file: tom_v2, axes: [tau2], layer: 8}]
  tom2_L10:
