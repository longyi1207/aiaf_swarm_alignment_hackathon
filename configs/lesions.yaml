  rand2_L16:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 16}]
  rand2_L18:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 18}]
  rand2_L20:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 20}]
  rand2_L22:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 22}]
  rand2_L24:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 24}]
  rand2_L26:
