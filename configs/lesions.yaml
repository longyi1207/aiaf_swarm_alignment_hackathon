  tom2_mid:
    edits: [{file: tom_v2, axes: [tau2], layers: [12, 13, 14, 15, 16, 17, 18, 19, 20]}]
  tom2_late:
    edits: [{file: tom_v2, axes: [tau2], layers: [20, 21, 22, 23, 24, 25, 26, 27, 28]}]
  tom2_all_a30:
    edits: [{file: tom_v2, axes: [tau2], layers: all, alpha: 0.3}]
  tom2_all_a50:
    edits: [{file: tom_v2, axes: [tau2], layers: all, alpha: 0.5}]
  rand2_L4:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 4}]
  rand2_L6:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 6}]
  rand2_L8:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 8}]
  rand2_L10:
    edits: [{file: rand_dirs, axes: [rand_dir], layer: 10}]
  rand2_L12:
