  tom2_L16:
    edits: [{file: tom_v2, axes: [tau2], layer: 16}]
  tom2_L18:
    edits: [{file: tom_v2, axes: [tau2], layer: 18}]
  tom2_L20:
    edits: [{file: tom_v2, axes: [tau2], layer: 20}]
  tom2_L22:
    edits: [{file: tom_v2, axes: [tau2], layer: 22}]
  tom2_L24:
    edits: [{file: tom_v2, axes: [tau2], layer: 24}]
  tom2_L26:
