# 校准 v4c（方案 A，2026-11-07，等 LY 选）：v4 / v4p / v4u 里只有 12–18% 的 agent 打开 personal/，所以把它自己的钱的情况
# （月缺口、存款、贷款 3 月涨息、旅行欠款、升级条件和"提前终止合同算合同问题"）直接写进自我描述。只测 $300 奖金，8 局。
run_id: calib_v4c
out_dir: runs
backend:
  type: vllm
  model: Qwen/Qwen3.5-9B
  dtype: bfloat16
  enable_thinking: true      # LY：v4 开思考
  max_new_tokens: 4096
  temperature: 0.6
  top_p: 0.95
  enforce_eager: true
  gpu_memory_utilization: 0.94
  max_prompt_tokens: 98304
lesions_config: configs/lesions.yaml
world: {n_agents: 5, threshold: 3, monthly_pay_usd: 6000}   # LY：月薪 $6,000
design:
  seeds: [101, 102]
  k_evidence: [5]
  harm: [low, high]
  communication: [isolated, discuss]
  lesion_conditions: [none]
  briefs: [v4c]                # 方案 A：自我描述里直接写 agent 自己的钱的情况（来自它的 personal/notes.md 和 hr/role_profile.md），不写目标
  awards: [300]               # LY 11-07：只测有 $300 一次性奖金的版本（立案成功时每个举报者）
protocol:
  analysis_max_steps: 40
  discussion_minutes: 10
  minutes_per_round: 2
